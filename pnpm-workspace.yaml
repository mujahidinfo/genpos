packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  '@scarf/scarf': false
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

