<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — GenPOS</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 10px 30px -12px rgb(15 23 42 / 0.15);
      }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 20px; background: #eef2ff;
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-size: 18px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.6; color: #64748b; margin: 0 0 24px; }
      button {
        width: 100%; height: 48px; border: 0; border-radius: 14px;
        background: #4f46e5; color: #fff;
        font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        GenPOS needs a connection to load sales, stock and customer data.
        Reconnect and try again — nothing in your cart has been sent yet.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
